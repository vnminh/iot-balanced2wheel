; ESP32 #2: mic INMP441 (I2S) -> WiFi WebSocket -> Raspberry Pi (Speech-control, cổng 8765)
;   pio run -t upload            nạp (cắm USB vào ESP32 #2)
;   pio device monitor           xem log (WiFi, kết nối, mức âm)
; Trước khi nạp: chép include/secrets.h.example thành include/secrets.h và điền tên + mật khẩu WiFi.
; Cùng nền tảng với firmware/ (Arduino-ESP32 core 3.x, dùng driver I2S mới driver/i2s_std.h).

[platformio]
default_envs = mic

[env:mic]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = -Wall
