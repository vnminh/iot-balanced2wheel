; Firmware ESP32 cho xe cân bằng + SLAM 2D trần nhà (iot-ck)
;   pio run -e main -t upload          chương trình chính
;   pio run -e test_driver -t upload   test A4988 + động cơ (gõ lệnh qua USB)
;   pio run -e test_mpu -t upload      test MPU-6050
; Arduino-ESP32 core 3.x (platform 8.x) vì steppers.cpp dùng API timer mới.

[platformio]
default_envs = main

[env]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = -Wall

[env:main]
build_src_filter = +<*> -<tests/>

[env:test_driver]
build_src_filter = +<tests/test_driver.cpp> +<steppers.cpp>

[env:test_mpu]
build_src_filter = +<tests/test_mpu.cpp> +<imu.cpp>
