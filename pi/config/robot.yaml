# Cấu hình robotd (pi/robot/main.py). Thông số SLAM nằm ở slam.yaml.
serial:
  port: /dev/serial0
  baud: 460800          # phải khớp LINK_BAUD trong firmware/include/config.h

camera:                 # OV5647 gắn HƯỚNG LÊN TRẦN (SLAM-DESIGN.md)
  enable: true
  width: 640
  height: 480
  fps: 15
  sensor_size: [1296, 972]   # OV5647 chế độ toàn khung (binning 2x2)
  exposure_us: 12000    # cố định 12 ms (ít nhoè khi xe chúi). 0 = tự động
  gain: 8.0             # tăng nếu ảnh trần tối (tối đa ~16), chỉ dùng khi exposure_us > 0
  readout_s: 0.020      # thời gian đọc hết khung (rolling shutter) của chế độ trên
  extra_shift_s: 0.0

slam:
  enable: true
  node: ../slam/build/slam_node     # pi/scripts/build_slam.sh
  config: slam.yaml
  shm: /dev/shm/slam                # grid.png / frame.jpg cho web (RAM, không ghi thẻ nhớ)
  log_dir: ""                       # vd ../../logs: ghi toàn bộ dữ liệu vào để replay (~1 MB/s, thẻ nhớ đầy nhanh)
  autoload: ""                      # mã bản đồ tự tải khi khởi động (trống = bắt đầu bản đồ mới)
  autoload_mode: localization       # localization | mapping

drive:                  # giới hạn lệnh (tay và goto); firmware còn chặn thêm CMD_MAX_*
  max_speed: 0.20       # m/s
  max_turn: 0.10        # m/s chênh lệch mỗi bánh khi quay (goto: ω 1 rad/s = 0.085)
  timeout_s: 0.4        # lâu không có lệnh mới -> dừng xe
  # Siêu âm (vị trí cảm biến do ESP32 gửi): giảm tốc khi TIẾN cho mọi nguồn lệnh. ESP32 còn dừng khẩn riêng.
  sonar_stop: 0.15      # m khoảng trống phía trước: không cho tiến
  sonar_slow: 0.50      # m: bắt đầu giảm tốc
  sonar_corridor: 0.15  # m nửa bề rộng hành lang thân xe
  sonar_fresh_s: 0.5    # số đo cũ hơn coi như thiếu dữ liệu (chạy tối đa nửa tốc độ)

voice:                  # lệnh giọng nói từ Speech-control (ws://127.0.0.1:8080/ws/voice), robot/voice.py
  enable: true
  v_max: 0.10           # m/s khi tiến/lùi theo giọng nói
  w_max: 0.8            # rad/s khi xoay (~46°/s)
  max_distance_m: 3.0   # một lệnh tiến/lùi tối đa
  max_angle_deg: 720
  queue_max: 5          # nói nhiều lệnh liền -> xếp hàng
  web_hold_s: 2.0       # web vừa lái tay trong khoảng này -> bỏ qua giọng nói (web ưu tiên)
  tol_m: 0.005          # sai số chấp nhận
  tol_deg: 2.0
  turn_source: gyro     # gyro (bù bias khi đứng yên) | wheels (cần wheel_base đúng)

web:
  host: 0.0.0.0
  port: 8080

maps:
  dir: ../../maps       # = ~/iot-ck/maps (tương đối với thư mục config này)
