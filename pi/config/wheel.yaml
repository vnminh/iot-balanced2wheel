%YAML:1.0
# Odometry bánh xe cho ovw_node (xe cân bằng, bánh không trượt).
enable: 1
steps_per_meter: 15670.64     # 200*16 bước/vòng / (pi * 0.065 m)
wheel_radius: 0.0325          # m
axle_in_imu: [0.0, 1.0, 0.0]  # trục bánh chỉ sang TRÁI = trục Y của MPU
p_axle_in_imu: [0.0, 0.0, -0.05]  # tâm trục bánh so với MPU (m). ĐO LẠI: MPU cao hơn trục bao nhiêu
sigma_fwd: 0.03               # m/s
sigma_lat: 0.02
sigma_vert: 0.03
chi2_mult: 3.0
window: 0.03                  # s
