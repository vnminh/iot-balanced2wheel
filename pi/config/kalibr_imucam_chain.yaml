%YAML:1.0
# OV5647, chế độ 1296x972 (toàn khung, binning 2x2) thu nhỏ về 640x480.
# Nội tham số dưới đây là ƯỚC LƯỢNG cho ống kính 3.6 mm gốc (fx = 3.6/0.0014*640/2592).
# Chạy  python3 -m robot.calibrate  để hiệu chỉnh thật rồi dán kết quả vào đây.
#
# Camera nhìn thẳng về TRƯỚC: z_cam = x_imu, x_cam = -y_imu, y_cam = -z_imu.
# Cột cuối là vị trí camera trong khung IMU (m): ĐO LẠI trên xe của bạn.
cam0:
  T_imu_cam: # R_CtoI | p_CinI
    - [ 0.0,  0.0, 1.0, 0.03]
    - [-1.0,  0.0, 0.0, 0.00]
    - [ 0.0, -1.0, 0.0, 0.10]
    - [ 0.0,  0.0, 0.0, 1.0]
  cam_overlaps: []
  camera_model: pinhole
  distortion_coeffs: [0.0, 0.0, 0.0, 0.0]
  distortion_model: radtan
  intrinsics: [635.0, 635.0, 320.0, 240.0] # fu, fv, cu, cv
  resolution: [640, 480]
  rostopic: /cam0/image_raw
  timeshift_cam_imu: 0.0
