%YAML:1.0
# OpenVINS cho xe cân bằng: 1 camera OV5647 (rolling shutter) + MPU-6050 qua ESP32.
# Thông số đã giảm để chạy thời gian thực trên Raspberry Pi 4.

verbosity: "WARNING"          # ALL, DEBUG, INFO, WARNING, ERROR, SILENT

use_fej: true
integration: "rk4"
use_stereo: false
max_cameras: 1

calib_cam_extrinsics: true    # T_imu_cam chỉ là ước lượng tay -> để bộ lọc tự tinh chỉnh
calib_cam_intrinsics: true    # chưa hiệu chỉnh camera thì để true; có kết quả calibrate rồi có thể đặt false
calib_cam_timeoffset: true    # lệch thời gian camera - IMU (qua UART) tự ước lượng
calib_imu_intrinsics: false
calib_imu_g_sensitivity: false

max_clones: 11
max_slam: 30
max_slam_in_update: 15
max_msckf_in_update: 30
dt_slam_delay: 2
gravity_mag: 9.78             # Việt Nam ~9.78 m/s^2

feat_rep_msckf: "GLOBAL_3D"
feat_rep_slam: "ANCHORED_MSCKF_INVERSE_DEPTH"
feat_rep_aruco: "ANCHORED_MSCKF_INVERSE_DEPTH"

# ZUPT chỉ dùng lúc đầu: cho phép khởi tạo tĩnh ngay khi xe đang đứng cân bằng
# (không cần chờ "giật"). Sau đó odometry bánh xe lo phần vận tốc.
try_zupt: true
zupt_chi2_multipler: 0        # 0 = chỉ dựa vào độ dịch ảnh (IMU rung do động cơ bước)
zupt_max_velocity: 0.1
zupt_noise_multiplier: 10
zupt_max_disparity: 1.0
zupt_only_at_beginning: true

init_window_time: 1.5
init_imu_thresh: 2.0          # xe cân bằng luôn lắc nhẹ -> ngưỡng rộng hơn mặc định
init_max_disparity: 4.0
init_max_features: 50
init_dyn_use: false
init_dyn_mle_opt_calib: false
init_dyn_mle_max_iter: 50
init_dyn_mle_max_time: 0.05
init_dyn_mle_max_threads: 2
init_dyn_num_pose: 6
init_dyn_min_deg: 10.0
init_dyn_inflation_ori: 10
init_dyn_inflation_vel: 100
init_dyn_inflation_bg: 10
init_dyn_inflation_ba: 100
init_dyn_min_rec_cond: 1e-12
init_dyn_bias_g: [ 0.0, 0.0, 0.0 ]
init_dyn_bias_a: [ 0.0, 0.0, 0.0 ]

record_timing_information: false
record_timing_filepath: "/tmp/traj_timing.txt"
save_total_state: false
filepath_est: "/tmp/ov_estimate.txt"
filepath_std: "/tmp/ov_estimate_std.txt"
filepath_gt: "/tmp/ov_groundtruth.txt"

use_klt: true
num_pts: 150
fast_threshold: 15
grid_x: 5
grid_y: 4
min_px_dist: 15
knn_ratio: 0.70
track_frequency: 31.0
downsample_cameras: false
num_opencv_threads: 2
histogram_method: "HISTOGRAM"

use_aruco: false
num_aruco: 1024
downsize_aruco: true

up_msckf_sigma_px: 1.5        # rolling shutter -> nhiễu điểm ảnh lớn hơn
up_msckf_chi2_multipler: 1
up_slam_sigma_px: 1.5
up_slam_chi2_multipler: 1
up_aruco_sigma_px: 1
up_aruco_chi2_multipler: 1

use_mask: false

# Tam giác hoá: xe chạy chậm (0.1-0.2 m/s) nên đường cơ sở giữa các khung ngắn so với
# khoảng cách tới tường -> nới giới hạn tỉ lệ khoảng cách/đường cơ sở (mặc định 40).
fi_max_baseline: 150
fi_max_cond_number: 30000
fi_min_dist: 0.15
fi_max_dist: 25

relative_config_imu: "kalibr_imu_chain.yaml"
relative_config_imucam: "kalibr_imucam_chain.yaml"
